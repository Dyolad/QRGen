steps:
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g eas-cli
        export NODE_ENV=production
        export EXPO_TOKEN="Nkr40J195TFXi_B4NW1gV5HXRt6Hna_4riLONNM6"
        
        # Inizializza automaticamente il progetto per il nuovo account ed evita il blocco interattivo
        eas project:init --non-interactive || true
        
        eas build --platform android --profile preview --non-interactive --clear-cache

options:
  logging: CLOUD_LOGGING_ONLY
