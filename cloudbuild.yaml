steps:
  - name: 'reactnativecommunity/react-native-android:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install
        npx expo install --fix
        npx expo prebuild --platform android --non-interactive
        cd android
        ./gradlew assembleRelease
        ./gradlew bundleRelease
        cp app/build/outputs/apk/release/app-release.apk ../advanced-qr.apk
        cp app/build/outputs/bundle/release/app-release.aab ../advanced-qr.aab

artifacts:
  objects:
    location: 'gs://${PROJECT_ID}_cloudbuild/builds/${BUILD_ID}'
    paths:
      - 'advanced-qr.apk'
      - 'advanced-qr.aab'

options:
  machineType: 'E2_HIGHCPU_8'
timeout: '3600s'
